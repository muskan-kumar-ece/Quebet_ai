  <!-- Q Leg / Circuit Lead -->
  <path d="M 125 115 L 155 145" fill="none" stroke="url(#qGrad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="155" cy="145" r="6" fill="#10B981" />
